<div class="login-page">
  <div class="login-card">
    <header class="login-header">
      <h1 class="login-title">
        Negocia<strong>.CAIXA</strong>
      </h1>
      <p class="login-subtitle">Sistema de Renegociação de Dívidas</p>
    </header>

    <form class="login-form" (ngSubmit)="entrar()">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input id="username" type="text" [ngModel]="username()" (ngModelChange)="username.set($event)" name="username"
          placeholder="Digite seu usuário" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="password-input-wrapper">
          <input id="password" [type]="hidePassword() ? 'password' : 'text'" [ngModel]="password()"
            (ngModelChange)="password.set($event)" name="password" placeholder="Digite sua senha"
            autocomplete="current-password" />
          <button mat-icon-button type="button" class="toggle-password"
            [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'" [attr.aria-pressed]="!hidePassword()"
            (click)="toggleHidePassword()">
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="!username().trim()">Entrar</button>
    </form>
  </div>
</div>
