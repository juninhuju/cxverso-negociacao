<div class="success-wrapper">
  <section class="success-surface" aria-label="Renegociação formalizada">
    <!-- Ícone -->
    <div class="success-icon" aria-hidden="true">
      <mat-icon>check</mat-icon>
    </div>

    <!-- Título -->
    <h2 class="success-title">Renegociação Formalizada com Sucesso</h2>

    <!-- Banner -->
    <div class="success-banner" role="status" aria-live="polite">
      Comunicação automática enviada às áreas responsáveis
    </div>

    <!-- Card documentos -->
    <div class="docs-card" aria-label="Documentos da renegociação">
      <h3 class="docs-title">Documentos da Renegociação</h3>
      <p class="docs-subtitle">Gere o contrato e o boleto da entrada para prosseguir</p>

      <button type="button" class="docs-button" (click)="gerarContratoEBoleto()" [disabled]="loading()">
        Gerar Contrato e Boleto da Entrada
      </button>

      <p class="docs-hint">
        O boleto único da entrada já contempla custas e honorários obrigatórios
      </p>
    </div>

    <!-- Ações -->
    <div class="bottom-actions">
      <button type="button" class="btn-primary" (click)="novaBusca()">
        Nova Busca
      </button>

      <button type="button" class="btn-primary" (click)="verPainel()">
        Ver Painel
      </button>
    </div>
  </section>
</div>
