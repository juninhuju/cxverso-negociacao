<div class="dialog-container" role="dialog" aria-modal="true" aria-labelledby="consulta-juridica-titulo">
  <header class="dialog-header">
    <div class="header-text">
      <h2 id="consulta-juridica-titulo">Consulta Jurídica</h2>
      <p>
        Texto gerado automaticamente com base no contrato selecionado<br />
        O conteúdo pode ser revisado antes do envio
      </p>
    </div>

    <button type="button" class="btn-close" aria-label="Fechar consulta jurídica" (click)="fechar()">✕</button>
  </header>

  <section class="dialog-body">

    @if (aviso) {
    <div class="alerta" role="status" aria-live="polite">
      {{ aviso }}
    </div>
    }

    <div class="email-preview" [class.editando]="modoEdicao">
      <label class="sr-only" for="consulta-juridica-texto">Texto da consulta jurídica</label>
      <textarea id="consulta-juridica-texto" [(ngModel)]="emailTexto" [readonly]="!modoEdicao" rows="20">
      </textarea>
    </div>

  </section>

  <footer class="dialog-footer">

    <button type="button" class="btn-secondary" (click)="alternarEdicao()">
      {{ modoEdicao ? 'Salvar texto' : 'Editar texto' }}
    </button>

    <button type="button" class="btn-secondary" (click)="copiarTexto()">
      Copiar
    </button>

    <button type="button" class="btn-secondary" (click)="fechar()">
      Voltar
    </button>

    <button type="button" class="btn-primary" (click)="enviarConsulta()">
      ✈ Enviar consulta
    </button>

  </footer>

</div>
