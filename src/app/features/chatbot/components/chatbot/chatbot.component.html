<section class="chatbot-page">

  <!-- SIDEBAR -->
  <aside class="chatbot-sidebar">
    <header class="sidebar-header">
      <h2>Conversas</h2>

      <button type="button" class="btn-secondary" (click)="novaConversa()">
        + Nova conversa
      </button>
    </header>

    <ul class="conversation-list">
      @for (c of conversas(); track c.id) {
      <li class="conversation-item" [class.conversation-item--active]="c.id === conversaAtivaId()"
        (click)="abrirConversa(c.id)">
        {{ c.titulo }}
      </li>
      } @empty {
      <li class="empty-state">Nenhuma conversa.</li>
      }
    </ul>
  </aside>

  <!-- MAIN -->
  <section class="chatbot-main">

    <div class="chatbot-header">
      <mat-icon>support_agent</mat-icon>
      <h1>Chatbot de Apoio</h1>
    </div>

    <!-- CONVERSA -->
    <div class="chat-thread">
      @if (conversaAtiva(); as chat) {
      @for (m of chat.mensagens; track m.id) {
      <div class="msg" [class.msg--user]="m.role === 'user'">
        <div class="bubble">
          {{ m.texto }}
          <small>{{ m.hora }}</small>
        </div>
      </div>
      }
      }
    </div>

    <!-- INPUT -->
    <form class="chat-actions" (submit)="enviarMensagem($event)">
      <input type="text" [formControl]="mensagem" placeholder="Digite sua mensagem..." />

      <button class="btn-primary" type="submit" [disabled]="!mensagem.value.trim()">
        Enviar
      </button>
    </form>

  </section>

</section>
