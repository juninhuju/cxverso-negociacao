<mat-sidenav-container class="shell-sidenav-container" [hasBackdrop]="true" (backdropClick)="closeSidenav()">
  <mat-sidenav #sidenav class="shell-sidenav" mode="over" [opened]="isSidenavOpen()" [disableClose]="false"
    [autoFocus]="false">
    <div class="shell-sidenav-inner">
      <section class="sidenav-top-brand" aria-label="Identidade do sistema">
        <div class="sidenav-brand-row">
          <span class="sidenav-brand-title">Negocia.CAIXA</span>
        </div>
        <p class="sidenav-brand-subtitle">Sistema de Renegociação</p>
      </section>

      <nav class="sidebar-nav" aria-label="Navegação">
        <a class="sidebar-link" routerLink="/renegociacao" routerLinkActive="sidebar-link--active"
          [routerLinkActiveOptions]="{ exact: false }" (click)="closeSidenav()">
          <mat-icon aria-hidden="true" class="mat-icon">handshake</mat-icon>
          <span>Negociar aqui</span>
        </a>
        <a class="sidebar-link" routerLink="/acompanhamento" routerLinkActive="sidebar-link--active"
          [routerLinkActiveOptions]="{ exact: false }" (click)="closeSidenav()">
          <mat-icon aria-hidden="true" class="mat-icon">apps</mat-icon>
          <span>Painel de acompanhamento</span>
        </a>
        <a class="sidebar-link" routerLink="/chatbot" routerLinkActive="sidebar-link--active"
          [routerLinkActiveOptions]="{ exact: false }" (click)="closeSidenav()">
          <mat-icon aria-hidden="true" class="mat-icon">support_agent</mat-icon>
          <span>Chatbot</span>
        </a>
      </nav>

      <section class="sidenav-user" aria-label="Dados do usuário">
        <mat-icon class="user-photo" aria-hidden="true">account_circle</mat-icon>
        <div class="user-meta">
          <span class="user-name">Funcionário {{ username() }}</span>
          <span class="user-matricula">Matrícula {{ matricula() }}</span>
        </div>
        <button mat-icon-button type="button" aria-label="Sair do sistema" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </section>
    </div>
  </mat-sidenav>

  <main class="shell-content" role="main">
    <header class="page-header" aria-label="Cabeçalho corporativo">
      <div class="page-header-left">
        <button mat-icon-button type="button" (click)="toggleSidenav()"
          [attr.aria-label]="isSidenavOpen() ? 'Fechar menu lateral' : 'Abrir menu lateral'"
          [attr.aria-pressed]="isSidenavOpen()">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="corp-title-group">
          <span class="corp-title">Sistema Corporativo CAIXA</span>
        </div>
      </div>

      <div class="page-header-right">
        <span class="date-label">{{ dataAtual() }}</span>
      </div>
    </header>

    <section #pageBodyRef class="page-body">
      <router-outlet (activate)="onRouteActivate()" />
    </section>
  </main>
</mat-sidenav-container>
