<div class="search-section">
  <div class="search-icon-badge">
    <mat-icon>handshake</mat-icon>
  </div>

  <h2 class="search-title">Negocie aqui</h2>
  <p class="search-subtitle">Sistema de Renegociação de Contratos Comerciais</p>

  <form class="search-form" (ngSubmit)="buscar()">
    <div class="search-box">
      <div class="search-input-row">
        <div class="search-input-wrapper">
          <mat-icon class="search-input-icon">search</mat-icon>
          <input type="text" [ngModel]="termoBusca()" (ngModelChange)="onTermoBuscaChange($event)" name="termoBusca"
            placeholder="Digite CPF, CNPJ ou número do contrato" class="search-input" [mask]="mascaraDocumento()"
            required />
        </div>

        <button type="submit" class="search-btn" [disabled]="!termoBusca().trim()" aria-label="Buscar contrato">
          Buscar
        </button>
      </div>

      <p class="search-helper-label" role="note">
        Consulte contratos inadimplentes e possibilidade de renegociação
      </p>
    </div>

    @if (erroSync()) {
    <p class="search-error" role="alert">{{ erroSync() }}</p>
    }
  </form>
</div>
