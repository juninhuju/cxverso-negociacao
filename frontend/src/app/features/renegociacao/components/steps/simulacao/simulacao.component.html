<div class="step-layout">
  <button class="step-back-link" (click)="voltar()" aria-label="Voltar">← Voltar</button>
  <header *ngIf="contrato() as c">
    <p class="step-subtitle">
      Contrato {{ c.numero }} • {{ c.cliente }}
    </p>
  </header>

  <!-- SUGESTÕES DE SIMULAÇÃO -->
  <section class="card card--sugestoes">
    <h3 class="card-title">Sugestões para você</h3>
    <app-sugestoes [opcoes]="opcoesVisiveis()" [opcaoSelecionada]="opcaoSelecionada()"
      (selecionar)="selecionarOpcao($event)" [aceitarOferta]="aceitarOferta.bind(this)"></app-sugestoes>
  </section>

  <!-- OUTRAS OPÇÕES COMO MODAL -->
  <div class="footer-options">
    <button class="btn-primary" (click)="abrirModalPersonalizada()">Outras opções</button>
  </div>

  <div class="modal-personalizada" *ngIf="modalPersonalizadaAberto">
    <div class="modal-backdrop" (click)="fecharModalPersonalizada()"></div>
    <div class="modal-content">
      <button class="modal-close" (click)="fecharModalPersonalizada()" aria-label="Fechar">×</button>
      <h3 class="card-title">Simulação personalizada</h3>
      <app-personalizada [valorEntrada]="valorEntrada()" [numeroParcelas]="numeroParcelas()"
        [entradaMinima]="entradaMinima()" [parcelaMinima]="parcelaMinima()" [parcelaMaxima]="parcelaMaxima()"
        (valorEntradaChange)="atualizarValorEntrada($event)" (numeroParcelasChange)="atualizarNumeroParcelas($event)"
        (simular)="simular()"></app-personalizada>
      <app-resultado [resultado]="resultadoPersonalizado()" [custasObrigatorias]="custasObrigatorias()"></app-resultado>
      <button class="btn-primary" (click)="concluirPersonalizada()">Concluir e ir para confirmação</button>
    </div>
  </div>
</div>
