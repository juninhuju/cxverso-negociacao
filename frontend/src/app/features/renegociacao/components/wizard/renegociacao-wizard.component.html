<div class="wizard-container">

  @if (stepAtual() > 0) {
  <aside class="wizard-sidebar">

    <!-- 🔷 LINHA 1 -->
    <div class="sidebar-header">
      <h1 class="sidebar-title">Renegociação</h1>
    </div>

    <!-- 🔷 LINHA 2 -->
    <div class="sidebar-content">

      <!-- ESQUERDA (PROGRESSO) -->
      <div class="sidebar-progress">
        <div class="progress-bar">
          <div class="progress-bar__fill" [style.width.%]="progressPercent">
          </div>
        </div>
        <p class="progress-label">{{ progressPercent }}% concluído</p>
      </div>

      <!-- DIREITA (STEPS) -->
      <div class="sidebar-steps">
        <ol class="steps-list">
          @for (step of steps; track step.path; let i = $index) {
          <li class="step-item" [class.step-done]="i < stepAtual()" [class.step-current]="i === stepAtual()">

            <span class="step-number">{{ i + 1 }}</span>
            <span class="step-label">{{ step.label }}</span>

          </li>
          }
        </ol>
      </div>

    </div>

  </aside>
  }

  <main class="wizard-content">
    <router-outlet></router-outlet>
  </main>

</div>
